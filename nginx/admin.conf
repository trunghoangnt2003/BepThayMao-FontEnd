server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  location = /healthz { default_type text/plain; return 200 'ok'; }
  location = /admin/index.html { add_header Cache-Control 'no-cache'; }
  location /admin/ { try_files $uri $uri/ /admin/index.html; }
  location ~* \.(?:js|css|woff2)$ { try_files $uri =404; expires 1y; add_header Cache-Control 'public, immutable'; }
}
