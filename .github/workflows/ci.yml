# Frontend CI (D-08): every step calls a repo script; actions are pinned to full commit SHAs.
# No backend here: api:check uses the committed openapi/v1.json and e2e:ci uses e2e/mock-api.mjs.
name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      # Untrusted refs reach scripts via env, never interpolated into run: (script injection).
      BASE_REF: ${{ github.base_ref || 'main' }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run api:check
      - run: npm run test:scripts
      - run: npm run licenses:check
      - run: npm run deps:audit
      - run: npm run secrets:scan
      - run: npm run drill
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:ci
      - run: npm run docker:build
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
      - if: github.event_name == 'pull_request'
        run: npx --no -- commitlint --from "origin/$BASE_REF" --to HEAD
      - if: github.event_name == 'pull_request'
        run: node scripts/check-branch-name.mjs --name "$HEAD_REF"
