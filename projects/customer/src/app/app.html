<a class="skip-link" href="#main">Bỏ qua tới nội dung chính</a>
<header>
  <div class="container topbar">
    <a class="brand" routerLink="/" aria-label="Bếp Thầy Mao, về trang giới thiệu"
      ><img
        class="logo"
        ngSrc="/images/logo-bep-thay-mao.png"
        width="85"
        height="58"
        alt=""
        priority
      /><span class="name">Bếp Thầy Mao</span></a
    >
    <nav class="main-nav" aria-label="Điều hướng chính">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          ariaCurrentWhenActive="page"
          >{{ link.label }}</a
        >
      }
    </nav>
    <button class="account" type="button" aria-label="Đăng nhập" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" />
      </svg>
    </button>
    <a class="order" routerLink="/dat-mon">Đặt món</a>
  </div>
</header>
<main id="main" class="container" tabindex="-1"><router-outlet /></main>
<cus-site-footer />

<nav class="bnav" aria-label="Điều hướng nhanh">
  @for (link of quick; track link.path) {
    <a
      [routerLink]="link.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: link.path === '/' }"
      ariaCurrentWhenActive="page"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        @for (d of link.icon; track $index) {
          <path [attr.d]="d" />
        }
      </svg>
      {{ link.label }}
      @if (link.path === '/dat-hang' && cart.count() > 0) {
        <span class="badge num" aria-hidden="true">{{ cart.count() }}</span>
      }
    </a>
  }
</nav>
<cus-route-loader />
