<a class="skip-link" href="#main">Bỏ qua tới nội dung chính</a>
@if (store.session(); as session) {
  <header>
    <div class="container topbar">
      <span class="wordmark">Bếp Thầy Mão</span><span class="area">Quản trị</span>
      <div class="account">
        <span class="identity"
          >{{ session.identifier }}
          <span>{{ session.role === 'Owner' ? 'Chủ sở hữu' : 'Quản lý cơ sở' }}</span></span
        >
        <button
          hlmBtn
          variant="outline"
          (click)="logout()"
          [attr.aria-label]="'Đăng xuất khỏi tài khoản ' + session.identifier"
        >
          <btm-icon name="sign-out" />Đăng xuất
        </button>
      </div>
    </div>
  </header>
  <nav class="container" aria-label="Điều hướng chính">
    @if (session.role === 'Owner') {
      <a routerLink="/owner/branches" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Cơ sở</a
      >
    } @else {
      <a routerLink="/manager/settings" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Thông số cơ sở</a
      >
    }
  </nav>
}
<main id="main" class="container" tabindex="-1"><router-outlet /></main>
